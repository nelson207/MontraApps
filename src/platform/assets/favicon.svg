<!-- montra-favicon-tight.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="M">
  <defs>
    <linearGradient id="montraGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2A6F"/>
      <stop offset="55%" stop-color="#0C6FB7"/>
      <stop offset="100%" stop-color="#16C2B0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="256" height="256" rx="50" fill="url(#montraGrad)"/>

  <text
    x="50%"
    y="55%"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#FFFFFF"
    font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-weight="900"
    font-size="150"
  >
    M
  </text>
