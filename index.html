<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The folder the app is served from, any name, with both slashes: "/" at the site root,
         "/Credit/" for https://site:5080/Credit/, "/apps/montra/" for …/apps/montra/.
         Set it when deploying (dist/<app>/index.html), no build needed. -->
    <base href="/" />
    <!-- Deployment settings (API address, sign-in): public/config.js, edited per environment -->
    <script src="config.js"></script>
    <link rel="icon" type="image/svg+xml" href="/src/platform/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Montra Credit</title>
    <script>
      // Light/dark before the app loads (no white flash in dark mode); the app keeps it in sync
      // afterwards (features/theme/useApplyTheme). Same storage key as platform/app/preferences.ts.
      (function () {
        var mode = "system";
        try {
          var saved = JSON.parse(localStorage.getItem("montra:preferences") || "{}");
          if (saved.theme && /^(light|dark)$/.test(saved.theme.mode)) mode = saved.theme.mode;
        } catch (e) {}
        if (mode === "system") mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-bs-theme", mode);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/platform/main.tsx"></script>
  </body>
</html>
